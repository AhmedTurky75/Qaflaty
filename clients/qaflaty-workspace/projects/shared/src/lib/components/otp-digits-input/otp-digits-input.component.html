<div
  class="flex justify-center gap-3"
  dir="ltr"
  (paste)="onPaste($event)"
>
  @for (digit of digits(); track $index; let i = $index) {
    <input
      #digitInput
      type="text"
      inputmode="numeric"
      maxlength="1"
      [value]="digit"
      [disabled]="disabled()"
      (input)="onInput(i, $event)"
      (keydown)="onKeydown(i, $event)"
      class="w-12 h-14 text-center text-xl font-bold border-2 rounded-xl focus:outline-none transition-colors"
      [class.border-gray-300]="!digit && !hasError()"
      [class.border-primary]="!!digit && !hasError()"
      [class.border-red-400]="hasError()"
      [class.focus:border-primary]="!hasError()"
      autocomplete="one-time-code"
    />
  }
</div>
