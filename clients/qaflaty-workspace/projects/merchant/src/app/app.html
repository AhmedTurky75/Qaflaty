<router-outlet></router-outlet>

<!-- ────────────────────────────────────────────────────────────────────────
     TEMPORARY Phase-1 proof widget. Demonstrates that theme + direction swaps
     repaint instantly via tokens. Replaced by the real theme picker (Settings)
     and topbar controls in later phases — delete this block then.
     ──────────────────────────────────────────────────────────────────────── -->
@if (proofOpen()) {
  <div
    class="fixed end-4 bottom-4 z-[9999] w-64 rounded-[14px] border border-border bg-surface p-4 text-text shadow-xl"
  >
    <div class="mb-3 flex items-center justify-between">
      <span class="text-sm font-bold">Theme proof</span>
      <button
        type="button"
        class="rounded-md px-2 py-1 text-xs text-text-muted hover:bg-surface-elevated focus:outline-none focus:ring-2 focus:ring-primary"
        (click)="proofOpen.set(false)"
        aria-label="Close theme proof"
      >✕</button>
    </div>

    <div class="grid grid-cols-3 gap-2">
      @for (t of theme.themes; track t) {
        <button
          type="button"
          class="rounded-lg border px-1 py-2 text-[11px] font-semibold capitalize focus:outline-none focus:ring-2 focus:ring-primary"
          [class.border-primary]="theme.current() === t"
          [class.bg-primary]="theme.current() === t"
          [class.text-white]="theme.current() === t"
          [class.border-border]="theme.current() !== t"
          [class.text-text-muted]="theme.current() !== t"
          (click)="setTheme(t)"
        >{{ t }}</button>
      }
    </div>

    <div class="mt-3 rounded-lg bg-surface-elevated p-3">
      <div class="text-xs text-text-muted">Sample card · <span class="text-primary font-semibold">primary</span></div>
      <div class="mt-2 flex gap-2">
        <span class="rounded-full bg-primary-tint px-2 py-1 text-[11px] font-bold text-primary">New</span>
        <span class="rounded-full bg-primary px-2 py-1 text-[11px] font-bold text-white">Save</span>
      </div>
    </div>

    <button
      type="button"
      class="mt-3 w-full rounded-lg border border-border py-2 text-xs font-semibold text-text hover:bg-surface-elevated focus:outline-none focus:ring-2 focus:ring-primary"
      (click)="direction.toggle()"
    >Direction: {{ direction.dir() }} — toggle EN/AR</button>
  </div>
} @else {
  <button
    type="button"
    class="fixed end-4 bottom-4 z-[9999] rounded-full border border-border bg-surface px-3 py-2 text-xs font-semibold text-text shadow-lg focus:outline-none focus:ring-2 focus:ring-primary"
    (click)="proofOpen.set(true)"
    aria-label="Open theme proof"
  >🎨 Theme</button>
}
