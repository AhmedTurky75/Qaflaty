<div class="min-h-screen bg-canvas text-text">
  <!-- Rail (desktop, fixed) -->
  <div class="hidden lg:fixed lg:inset-y-0 lg:start-0 lg:z-30 lg:block">
    <app-rail [chatUnread]="chatUnreadCount()" (more)="drawerOpen.set(true)" />
  </div>

  <!-- Content column -->
  <div class="flex min-h-screen w-full flex-col lg:ps-64">
    <app-topbar (menu)="drawerOpen.set(true)" />

    <main class="flex-1 p-4 pb-20 sm:p-6 lg:pb-6">
      <router-outlet />
    </main>
  </div>

  <!-- Mobile bottom navigation -->
  <app-bottom-nav [chatUnread]="chatUnreadCount()" (more)="drawerOpen.set(true)" />

  <!-- Shared "More" / mobile nav drawer -->
  <app-nav-drawer
    [open]="drawerOpen()"
    [chatUnread]="chatUnreadCount()"
    (close)="drawerOpen.set(false)"
  />
</div>
