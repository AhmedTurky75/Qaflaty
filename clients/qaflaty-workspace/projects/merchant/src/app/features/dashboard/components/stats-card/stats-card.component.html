<div class="rounded-2xl border border-border bg-surface p-5 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0 flex-1">
      <p class="mb-1 text-sm font-medium text-text-muted">{{ title }}</p>
      <p class="text-2xl font-bold text-text">{{ value }}</p>
      @if (trend !== undefined && trend !== null) {
        <div class="mt-2 flex items-center gap-1">
          @if (trend > 0) {
            <span class="text-success"><app-icon name="trend-up" [size]="16" /></span>
            <span class="text-sm font-medium text-success">{{ trend }}%</span>
          } @else if (trend < 0) {
            <span class="text-danger"><app-icon name="trend-down" [size]="16" /></span>
            <span class="text-sm font-medium text-danger">{{ Math.abs(trend) }}%</span>
          } @else {
            <span class="text-sm font-medium text-text-muted">0%</span>
          }
          <span class="ms-1 text-xs text-text-muted">{{ 'dashboard.vsLastPeriod' | transloco }}</span>
        </div>
      }
    </div>
    <span class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-xl" [class]="accentClasses">
      <app-icon [name]="iconName" [size]="24" />
    </span>
  </div>
</div>
