<div class="space-y-8">
  <!-- Theme picker -->
  <section>
    <h2 class="text-lg font-bold text-text">{{ 'theme.title' | transloco }}</h2>
    <p class="mt-1 text-sm text-text-muted">{{ 'theme.pickerHint' | transloco }}</p>

    <div class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3">
      @for (p of previews; track p.id) {
        <button
          type="button"
          (click)="selectTheme(p.id)"
          class="group relative overflow-hidden rounded-2xl border-2 text-start transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          [class.border-primary]="theme.current() === p.id"
          [class.border-border]="theme.current() !== p.id"
          [attr.aria-pressed]="theme.current() === p.id"
        >
          <!-- Live mini preview -->
          <div class="flex h-24" [style.background-color]="p.canvas">
            <div class="flex w-1/3 flex-col gap-1.5 p-2" [style.background-color]="p.rail">
              <span class="h-2.5 w-2.5 rounded" [style.background-color]="p.primary"></span>
              <span class="mt-1 h-1.5 w-3/4 rounded bg-white/25"></span>
              <span class="h-1.5 w-1/2 rounded bg-white/25"></span>
            </div>
            <div class="flex-1 p-2">
              <div class="rounded-md p-1.5 shadow-sm" [style.background-color]="p.surface">
                <span class="block h-1.5 w-2/3 rounded" [style.background-color]="p.text" [style.opacity]="0.7"></span>
                <span class="mt-1.5 inline-block h-3 w-8 rounded" [style.background-color]="p.primary"></span>
              </div>
            </div>
          </div>
          <!-- Label + tick -->
          <div class="flex items-center justify-between bg-surface px-3 py-2">
            <span class="text-sm font-medium text-text">{{ 'theme.' + p.id | transloco }}</span>
            @if (theme.current() === p.id) {
              <span class="flex h-5 w-5 items-center justify-center rounded-full bg-primary text-white"><app-icon name="check" [size]="12" /></span>
            }
          </div>
        </button>
      }
    </div>
  </section>

  <!-- Language -->
  <section>
    <h2 class="text-lg font-bold text-text">{{ 'theme.language' | transloco }}</h2>
    <div class="mt-3 inline-flex rounded-[10px] border border-border bg-surface p-1">
      @for (lang of direction.languages; track lang) {
        <button
          type="button"
          (click)="selectLang(lang)"
          class="min-h-[40px] rounded-lg px-4 py-2 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          [class.bg-primary]="direction.lang() === lang"
          [class.text-white]="direction.lang() === lang"
          [class.text-text-muted]="direction.lang() !== lang"
        >{{ 'theme.lang.' + lang | transloco }}</button>
      }
    </div>
  </section>

  <!-- Text size -->
  <section>
    <h2 class="text-lg font-bold text-text">{{ 'theme.textSize' | transloco }}</h2>
    <div class="mt-3 inline-flex rounded-[10px] border border-border bg-surface p-1">
      @for (size of theme.textSizes; track size) {
        <button
          type="button"
          (click)="selectTextSize(size)"
          class="min-h-[40px] rounded-lg px-4 py-2 font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          [class.bg-primary]="theme.textSize() === size"
          [class.text-white]="theme.textSize() === size"
          [class.text-text-muted]="theme.textSize() !== size"
          [class.text-xs]="size === 'small'"
          [class.text-sm]="size === 'normal'"
          [class.text-base]="size === 'large'"
        >{{ 'theme.size.' + size | transloco }}</button>
      }
    </div>
  </section>
</div>
