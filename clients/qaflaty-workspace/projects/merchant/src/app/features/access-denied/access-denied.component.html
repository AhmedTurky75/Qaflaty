<div class="flex min-h-screen items-center justify-center bg-canvas px-4">
  <div class="w-full max-w-md text-center">
    <div class="mb-6 flex justify-center">
      <span class="flex h-16 w-16 items-center justify-center rounded-full bg-danger/10 text-danger">
        <app-icon name="alert-triangle" [size]="32" />
      </span>
    </div>

    <h1 class="mb-2 text-2xl font-bold text-text">{{ 'accessDenied.title' | transloco }}</h1>
    <p class="mb-8 text-text-muted">{{ 'accessDenied.message' | transloco }}</p>

    @if (reported()) {
      <div class="mb-6 rounded-lg border border-success/30 bg-success/10 p-4">
        <p class="text-sm text-success">{{ 'accessDenied.reportSent' | transloco }}</p>
      </div>
    } @else if (reportError()) {
      <div class="mb-6 rounded-lg border border-danger/30 bg-danger/10 p-4">
        <p class="text-sm text-danger">{{ 'accessDenied.reportFailed' | transloco }}</p>
      </div>
    }

    <div class="flex flex-col gap-3">
      @if (!reported()) {
        <button
          (click)="reportToAdmin()"
          [disabled]="reporting()"
          class="min-h-[44px] w-full rounded-lg bg-danger px-4 py-2.5 font-medium text-white transition-colors hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-danger/40 disabled:opacity-50"
        >
          {{ (reporting() ? 'accessDenied.sendingReport' : 'accessDenied.reportToAdmin') | transloco }}
        </button>
      }
      <button
        (click)="goBack()"
        class="min-h-[44px] w-full rounded-lg border border-border bg-surface px-4 py-2.5 font-medium text-text transition-colors hover:bg-surface-elevated focus:outline-none focus:ring-2 focus:ring-primary/40"
      >
        {{ 'accessDenied.goBack' | transloco }}
      </button>
    </div>
  </div>
</div>
