<div>
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-text">Ads management</h1>
    <nav class="mt-2 flex items-center gap-2 text-sm text-text-muted" aria-label="Breadcrumb">
      <a routerLink="/dashboard" class="hover:text-primary">Dashboard</a>
      <span class="rtl:rotate-180"><app-icon name="chevron-right" [size]="14" /></span>
      <span class="text-text">Ads management</span>
    </nav>
  </div>

  <div class="flex flex-col gap-6 lg:flex-row">
    <div class="flex-shrink-0 lg:w-64">
      <nav class="rounded-2xl border border-border bg-surface p-2 shadow-sm">
        <div class="space-y-1">
          @for (item of navigation; track item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-primary-tint text-primary"
              [routerLinkActiveOptions]="{ exact: false }"
              class="flex min-h-[44px] items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-text transition-colors hover:bg-surface-elevated focus:outline-none focus:ring-2 focus:ring-primary/40"
            >
              <span class="w-6 text-lg">{{ item.icon }}</span>
              {{ item.name }}
            </a>
          }
        </div>
      </nav>
    </div>

    <div class="min-w-0 flex-1">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
