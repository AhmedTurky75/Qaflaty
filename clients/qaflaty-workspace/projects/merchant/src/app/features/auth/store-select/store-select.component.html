<div class="flex min-h-screen flex-col justify-center bg-canvas px-4 py-12 sm:px-6">
  <div class="mx-auto w-full max-w-md text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-primary text-xl font-bold text-white">Q</div>
    <h1 class="text-2xl font-bold text-text">{{ 'common.appName' | transloco }}</h1>
    <h2 class="mt-2 text-lg font-semibold text-text-muted">{{ 'auth.selectStoreTitle' | transloco }}</h2>
    <p class="mt-2 text-sm text-text-muted">
      {{ 'auth.selectStoreWelcome' | transloco: { name: merchant()?.firstName } }}
    </p>
  </div>

  <div class="mx-auto mt-8 w-full max-w-md">
    <div class="space-y-3 rounded-2xl border border-border bg-surface p-6 shadow-sm sm:p-8">
      @if (loading()) {
        <div class="py-4 text-center text-sm text-text-muted">{{ 'auth.loadingStores' | transloco }}</div>
      }
      @for (store of stores(); track store.id) {
        <button
          (click)="selectStore(store)"
          class="flex min-h-[44px] w-full items-center justify-between rounded-xl border border-border px-4 py-3 text-start transition-colors hover:border-primary hover:bg-primary-tint focus:outline-none focus:ring-2 focus:ring-primary/40"
        >
          <span class="min-w-0">
            <span class="block truncate font-medium text-text">{{ store.name }}</span>
            <span class="block truncate text-sm text-text-muted">{{ store.slug }}</span>
          </span>
          <span class="flex-shrink-0 text-text-muted rtl:rotate-180"><app-icon name="chevron-right" [size]="20" /></span>
        </button>
      }
      @if (error()) {
        <div class="rounded-lg bg-danger/10 p-3 text-center text-sm text-danger">{{ error() }}</div>
      }
    </div>
  </div>
</div>
