<div>
  <label class="mb-1 block text-sm font-medium text-text">{{ label }}</label>

  <div class="relative">
    <input
      type="text"
      [formControl]="slugControl"
      (input)="onInput($event)"
      placeholder="my-awesome-store"
      class="block min-h-[44px] w-full rounded-[10px] border bg-surface-elevated px-3 py-2.5 pe-11 text-text focus:bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 sm:text-sm"
      [class.border-danger]="error()"
      [class.border-success]="available() === true"
      [class.border-border]="!error() && available() === null"
    />
    <div class="pointer-events-none absolute inset-y-0 end-0 flex items-center pe-3">
      @if (checking()) {
        <svg class="h-5 w-5 animate-spin text-text-muted" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
      } @else if (available() === true) {
        <span class="text-success"><app-icon name="check-circle" [size]="20" /></span>
      } @else if (error()) {
        <span class="text-danger"><app-icon name="x-circle" [size]="20" /></span>
      }
    </div>
  </div>

  <div class="mt-2 flex flex-wrap items-center gap-1 text-sm">
    <span class="text-text-muted"><app-icon name="folder" [size]="16" /></span>
    <span class="text-text-muted">{{ 'stores.slugPreview' | transloco }}</span>
    <code class="rounded bg-surface-elevated px-2 py-0.5 font-mono text-text">{{ getPreviewUrl() }}</code>
  </div>

  @if (error()) {
    <p class="mt-2 text-sm text-danger">{{ error() }}</p>
  } @else if (available() === true) {
    <p class="mt-2 text-sm text-success">✓ {{ 'stores.slugAvailable' | transloco }}</p>
  }

  <p class="mt-2 text-xs text-text-muted">{{ 'stores.slugHelp' | transloco }}</p>
</div>
