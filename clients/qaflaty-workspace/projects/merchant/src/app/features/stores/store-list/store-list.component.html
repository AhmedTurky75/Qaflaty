<div>
  <!-- Header -->
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-text">{{ 'stores.title' | transloco }}</h1>
      <p class="mt-1 text-sm text-text-muted">{{ 'stores.subtitle' | transloco }}</p>
    </div>
    <button type="button" (click)="navigateToCreateStore()"
      class="inline-flex min-h-[44px] items-center gap-2 rounded-[10px] bg-primary px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-primary/40">
      <app-icon name="plus" [size]="18" />
      {{ 'stores.create' | transloco }}
    </button>
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="flex items-center justify-center py-12 text-primary">
      <svg class="h-8 w-8 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    </div>
  }

  <!-- Error -->
  @else if (error()) {
    <div class="rounded-xl border border-danger/30 bg-danger/10 p-4">
      <div class="flex items-start gap-3">
        <span class="text-danger"><app-icon name="alert-triangle" [size]="20" /></span>
        <div>
          <h3 class="text-sm font-medium text-danger">{{ 'stores.errorTitle' | transloco }}</h3>
          <p class="mt-1 text-sm text-text-muted">{{ error() }}</p>
        </div>
      </div>
    </div>
  }

  <!-- Grid (with explicit Add card) -->
  @else {
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (store of stores(); track store.id) {
        <app-store-card [store]="store" (delete)="onDeleteStore($event)" />
      }

      <button
        type="button"
        (click)="navigateToCreateStore()"
        class="flex min-h-[220px] flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed border-border p-6 text-text-muted transition-colors hover:border-primary hover:bg-primary-tint hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/40"
      >
        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-surface-elevated"><app-icon name="plus" [size]="24" /></span>
        <span class="text-sm font-semibold">{{ (stores().length === 0 ? 'stores.createFirst' : 'stores.addStore') | transloco }}</span>
      </button>
    </div>
  }
</div>
