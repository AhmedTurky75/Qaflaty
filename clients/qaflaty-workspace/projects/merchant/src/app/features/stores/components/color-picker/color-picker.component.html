<div>
  <label class="mb-2 block text-sm font-medium text-text">{{ label }}</label>

  <!-- Custom color input -->
  <div class="mb-4 flex items-center gap-3">
    <input type="color" [formControl]="colorControl" (change)="onColorChange($event)" class="h-10 w-20 cursor-pointer rounded border border-border" />
    <input type="text" [formControl]="colorControl" (input)="onColorChange($event)" placeholder="#3B82F6" maxlength="7"
      class="min-h-[44px] flex-1 rounded-[10px] border border-border bg-surface-elevated px-3 py-2.5 font-mono uppercase text-text focus:border-primary focus:bg-surface focus:outline-none focus:ring-2 focus:ring-primary/30 sm:text-sm" />
    <div class="h-10 w-10 rounded-full border-2 border-border shadow-sm" [style.background-color]="selectedColor()"></div>
  </div>

  <!-- Predefined colours -->
  <div>
    <p class="mb-2 text-xs font-medium text-text-muted">{{ 'stores.quickColors' | transloco }}</p>
    <div class="grid grid-cols-6 gap-2">
      @for (color of predefinedColors; track color.value) {
        <button type="button" (click)="selectPredefinedColor(color.value)" class="group relative focus:outline-none" [title]="color.name">
          <div class="h-10 w-10 rounded-lg border-2 transition-all"
            [style.background-color]="color.value"
            [class.border-text]="selectedColor() === color.value"
            [class.border-border]="selectedColor() !== color.value"
            [class.scale-110]="selectedColor() === color.value"
            [class.shadow-lg]="selectedColor() === color.value"></div>
          @if (selectedColor() === color.value) {
            <div class="absolute inset-0 flex items-center justify-center text-white drop-shadow-lg"><app-icon name="check" [size]="22" /></div>
          }
        </button>
      }
    </div>
  </div>

  <p class="mt-3 text-xs text-text-muted">{{ 'stores.colorHelp' | transloco }}</p>
</div>
