@if (loading()) {
  <div class="min-h-screen bg-gray-50 py-8">
    <div class="container mx-auto px-4">
      <div class="animate-pulse">
        <div class="grid md:grid-cols-2 gap-8">
          <div class="bg-gray-300 h-96 rounded"></div>
          <div class="space-y-4">
            <div class="bg-gray-300 h-8 rounded"></div>
            <div class="bg-gray-300 h-6 rounded w-1/3"></div>
            <div class="bg-gray-300 h-24 rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
} @else if (product()) {
  <div class="min-h-screen bg-white pb-28">
    <div class="container mx-auto px-4 py-8">
      <div id="buy-box">
        <app-product-buy-box [product]="product()!" (reviewsClick)="scrollToReviews()" />
      </div>

      <app-section-renderer
        [sections]="enabledSections()"
        [product]="product()"
      />

      @if (bundleProducts().length > 0) {
        <app-product-row title="Complete the Set" [products]="bundleProducts()" />
      }

      @if (relatedProducts().length > 0) {
        <app-product-row title="You May Also Like" [products]="relatedProducts()" />
      }
    </div>
  </div>
} @else if (!loading()) {
  <div class="min-h-screen bg-gray-50 flex items-center justify-center">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-900 mb-4">Product Not Found</h1>
      <p class="text-gray-600 mb-8">The product you're looking for doesn't exist or has been removed.</p>
      <a [routerLink]="['/products']" class="inline-block px-6 py-3 bg-primary text-white rounded-lg hover:bg-primary-dark transition-colors">
        Browse All Products
      </a>
    </div>
  </div>
}
